                    </button>
                    <button id="random_trip_button" onclick="nextVal(this, 'random_trip', ['No', 'Yes'], 'random_trip_text')"
                        onfocus="textFocus('5% chance to trip every time you dash.')" class="flex-item">
                        <div class="item-container">
                            <h2>Random Tripping</h2>
                        <div class="toggle-box" id="random_trip_text">No</div>
                        </div>
                    </button>
                </div>
            </div>
        </div>
        <div class="footer">
            <hr>
            <h2 id="focus-text"></h2>
        </div>
    </div>
    <script>
        var currentPresetIndex = -1;
        function initButtonLabels() {
            var buttons = document.querySelectorAll('button[onclick*="nextVal"]');

            for (var i = 0; i < buttons.length; i++) {
                var btn = buttons[i];
                var onclickAttr = btn.getAttribute('onclick');
                if (!onclickAttr) continue;

                var match = onclickAttr.match(/nextVal\s*\(\s*this\s*,\s*['"]([^'"]+)['"]\s*,\s*(\[[^\]]+\])\s*,\s*['"]([^'"]+)['"]\s*\)/);

                if (match) {
                    var key = match[1];
                    var labelsRaw = match[2];
                    var labelID = match[3];

                    try {
                        var labels = JSON.parse(labelsRaw.replace(/'/g, '"'));
                        
                        var val = config_map.hasOwnProperty(key) ? config_map[key] : 0;
                        val = val % labels.length;

                        var target = document.getElementById(labelID) || btn.querySelector('.toggle-box');
                        if (target && labels[val] !== undefined) {
                            target.textContent = labels[val];
                        }
                    } catch (e) {

                    }
                }
            }
        }
        document.addEventListener("DOMContentLoaded", function() {
            initButtonLabels();
        });

        // 2. Explicitly bind to window so HTML onclick="..." can ALWAYS reach it
        window.nextVal = function(self, key, labels, labelID) {
            if (!labels || !labels.length) return;

            // Fetch current value safely
            var currVal = config_map.hasOwnProperty(key) ? config_map[key] : 0;
            var next = (currVal + 1) % labels.length;
            config_map[key] = next;

            // Target update
            var x = document.getElementById(labelID);
            if (!x && self && self.querySelector) {
                x = self.querySelector('.toggle-box') || self.querySelector('div');
            }

            if (x) {
                // textContent is reliable across all WebKit versions
                x.textContent = labels[next];
                
                // Force WebKit screen repaint
                void x.offsetHeight;
            }
            currentPresetIndex = -1;
            var customLabel = document.getElementById('preset_name');
            if (customLabel) {
                customLabel.textContent = "Custom";
            }
        };

        function generateTOML(map) {
            var categories = {
                "general": [
                    "sh_macro", "hold_buffer", "hitstun", "hitlag", "ledges", "respawn_anim"
                ],
                "movement": [
                    "dash", "moonwalk", "pivots", "llpc", "jump_accel", "hitfall", 
                    "agt", "djc", "footstool", "edge_cancel", "jump_cancel", "g2a"
                ],
                "attacks": [
                    "jab_cancel", "dacus", "ac", "jcg", "grab", "lcancel", "special_cancel"
                ],
                "defense": [
                    "shield", "shield_health", "shieldstun", "airdodge", "shield_drop", 
                    "di", "no_tumble_di", "drift_di", "hitstun_cancel", "vertical_gravity"
                ],
                "stats": [
                    "ll", "initial_dash", "runspeed", "walkspeed", "airspeed", 
                    "airaccel", "traction", "fallspeed", "jump", "gravity", "weight"
                ],
                "special": [
                    "cancel_to_taunt", "parry_reflect", "taunt_cancel", "no_special_fall", "random_trip"
                ]
            };

            var lines = [];

            for (var category in categories) {
                if (categories.hasOwnProperty(category)) {
                    lines.push("[" + category + "]");

                    var keys = categories[category];
                    for (var i = 0; i < keys.length; i++) {
                        var key = keys[i];
                        var val = map.hasOwnProperty(key) ? map[key] : 0;
                        lines.push(key + "=" + val);
                    }

                    lines.push("");
                }
            }

            return lines.join("~").trim();
        };
        function saveTOMLandQuit() {
            str = generateTOML(config_map);
            location.href = "http://localhost/" + str;
        };
        function saveThisPreset() {
            presetOut = generateTOML(config_map);
            new_preset = prompt("Name your preset", "My Awesome Preset");
            location.href = "http://localhost/newpreset/" + new_preset + "/" + presetOut;
        };


        function cyclePreset() {
            if (typeof presets === 'undefined' || !presets || presets.length === 0) {
                var label = document.getElementById('preset_name');
                if (label) label.textContent = 'Custom';
                return;
            }

            currentPresetIndex++;
            if (currentPresetIndex >= presets.length) {
                currentPresetIndex = 0;
            }

            var selectedPreset = presets[currentPresetIndex];
            var presetName = selectedPreset[0];
            var presetConfig = selectedPreset[1];

            var label = document.getElementById('preset_name');
            if (label) {
                label.textContent = presetName;
            }

            for (var key in presetConfig) {
                if (presetConfig.hasOwnProperty(key)) {
                    config_map[key] = presetConfig[key];
                }
            }

            if (typeof initButtonLabels === 'function') {
                initButtonLabels();
            }
        }
    </script>
</body>

</html>
